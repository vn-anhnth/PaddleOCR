Global:
  use_gpu: True
  epoch_num: 105
  log_smooth_window: 20
  print_batch_step: 5
  save_model_dir: ./output/rec/pren_new
  save_epoch_step: 3
  # evaluation is run every 2000 iterations after the 4000th iteration
  # eval_batch_step: [4000, 2000]
  eval_batch_step: [0, 1000]
  cal_metric_during_train: True
  pretrained_model: 
  checkpoints:
  save_inference_dir:
  use_visualdl: False
  infer_img: doc/imgs_words/ch/word_1.jpg
  # for data or label process
  character_dict_path: ./ppocr/utils/dict/license_plate_vn_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: False
  use_space_char: False
  save_res_path: ./output/rec/predicts_pren.txt
  use_wandb: True

Optimizer:
  # name: Adadelta
  # lr:
  #   name: Piecewise
  #   decay_epochs: [2, 5, 7]
  #   values: [0.5, 0.1, 0.01, 0.001]

  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 10
  regularizer:
    name: 'L2'
    factor: 0

Architecture:
  model_type: rec
  algorithm: PREN
  in_channels: 3
  Backbone:
    name: EfficientNetb3_PREN
  Neck:
    name: PRENFPN
    n_r: 5
    d_model: 384
    max_len: *max_text_length
    dropout: 0.1
  Head:
    name: PRENHead

Loss:
  name: PRENLoss

PostProcess:
  name: PRENLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /root/.cache/kagglehub/datasets/anhlone3/ocr-license-plate-dataset/versions/8
    label_file_list:
    - /root/.cache/kagglehub/datasets/anhlone3/ocr-license-plate-dataset/versions/8/train_labels.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - PRENLabelEncode:
      - RecAug:
      - PRENResizeImg: 
          image_shape: [64, 256]  # h,w
      - KeepKeys:
          keep_keys: ['image', 'label']
  loader:
    shuffle: True
    batch_size_per_card: 128
    drop_last: True
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /root/.cache/kagglehub/datasets/anhlone3/ocr-license-plate-dataset/versions/8
    label_file_list:
    - /root/.cache/kagglehub/datasets/anhlone3/ocr-license-plate-dataset/versions/8/val_labels.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - PRENLabelEncode:
      - PRENResizeImg: 
          image_shape: [64, 256]  # h,w
      - KeepKeys:
          keep_keys: ['image', 'label']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 64
    num_workers: 8
